name: Verify public Pages
on:
  push:
    branches: [main]
    paths:
      - scripts/verify-live.mjs
      - .github/workflows/verify-public.yml
  workflow_run:
    workflows: [Validate and deploy portfolio]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect public Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{cname,https_enforced,build_type,status,html_url,source}'
      - run: node scripts/verify-live.mjs
        if: ${{ always() }}
