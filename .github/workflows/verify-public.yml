name: Verify public Pages
on:
  push:
    branches: [main]
    paths:
      - scripts/verify-live.mjs
      - .github/workflows/verify-public.yml
  workflow_run:
    workflows: [Validate and deploy portfolio]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/verify-live.mjs
